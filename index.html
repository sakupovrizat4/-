<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Беговой ритм — Личный кабинет</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Беговой ритм" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Custom Antigravity Polish & PWA Mobile Styles */
    :root {
      --brand-forest: #14532d;
      --brand-green: #16a34a;
      --brand-lime: #84cc16;
      --brand-bg: #f8fafc;
      --card-bg: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px -5px rgba(22, 163, 74, 0.08), 0 8px 10px -6px rgba(0,0,0,0.03);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--brand-bg);
      color: #0f172a;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
    }
    .sidebar-header {
      padding: 1.5rem 1.25rem;
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
    }
    .logo-icon-sm {
      font-size: 1.75rem;
      background: linear-gradient(135deg, #16a34a, #15803d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--brand-forest);
      letter-spacing: -0.02em;
    }
    .nav-item {
      font-weight: 500;
      border-radius: 10px;
      margin: 2px 10px;
      padding: 0.65rem 0.9rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-item:hover {
      background: #f1f5f9;
      transform: translateX(3px);
    }
    .nav-item.active {
      background: linear-gradient(135deg, #dcfce7, #bbf7d0);
      color: #14532d;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
    }
    .card {
      border: 1px solid #edf2f7;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 12px 30px rgba(0,0,0,0.07);
    }
    .btn {
      font-weight: 600;
      letter-spacing: -0.01em;
      border-radius: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #16a34a, #15803d);
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #15803d, #166534);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(22, 163, 74, 0.35);
    }
    .btn-secondary {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .btn-secondary:hover {
      background: #d1fae5;
      transform: translateY(-1px);
    }
    .btn-install-mobile {
      background: linear-gradient(135deg, #84cc16, #65a30d);
      color: #1a3a00;
      font-weight: 700;
      border: none;
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(132, 204, 22, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .modal-content {
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }
    .stat-card.highlight {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Overlay Window -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <button class="modal-close" onclick="App.closeModal()">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Auth Screen Hidden (Direct App Access Enabled) -->
  <div id="auth-screen" class="auth-screen" style="display:none"></div>

  <!-- Main Application Workspace -->
  <div id="app-main" class="app-main" style="display:flex">
    
    <!-- Mobile Header -->
    <header class="mobile-header">
      <button class="hamburger" onclick="App.toggleSidebar()">☰</button>
      <span class="mobile-title">Беговой ритм</span>
      <button class="btn-install-mobile" id="mobile-header-install-btn" onclick="App.installPWA()">📲 Установить</button>
    </header>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon-sm">🏃</span>
        <span class="sidebar-title">Беговой ритм</span>
        <button class="sidebar-toggle" onclick="App.closeSidebar()">✕</button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard'); return false;">
          <span class="nav-icon">⌂</span> Обзор
        </a>
        <a href="#" class="nav-item" data-page="calendar" onclick="App.navigate('calendar'); return false;">
          <span class="nav-icon">📅</span> Календарь
        </a>
        <a href="#" class="nav-item" data-page="history" onclick="App.navigate('history'); return false;">
          <span class="nav-icon">📋</span> История
        </a>
        <a href="#" class="nav-item" data-page="progress" onclick="App.navigate('progress'); return false;">
          <span class="nav-icon">↗</span> Прогресс
        </a>
        <a href="#" class="nav-item" data-page="zones" onclick="App.navigate('zones'); return false;">
          <span class="nav-icon">♥</span> Пульс и зоны
        </a>
        <a href="#" class="nav-item" data-page="methods" onclick="App.navigate('methods'); return false;">
          <span class="nav-icon">◎</span> Методики
        </a>
        <a href="#" class="nav-item" data-page="plans" onclick="App.navigate('plans'); return false;" style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a">
          <span class="nav-icon">📋</span> <strong>Планы подготовки</strong>
        </a>
        <a href="#" class="nav-item" data-page="run" onclick="App.navigate('run'); return false;">
          <span class="nav-icon">▶</span> Бег сейчас
        </a>
        <a href="#" class="nav-item" data-page="routes" onclick="App.navigate('routes'); return false;">
          <span class="nav-icon">🗺️</span> Маршруты
        </a>
        <a href="#" class="nav-item" data-page="cross-training" onclick="App.navigate('cross-training'); return false;">
          <span class="nav-icon">🧘</span> Восстановление
        </a>
        <a href="#" class="nav-item" data-page="nutrition" onclick="App.navigate('nutrition'); return false;">
          <span class="nav-icon">💧</span> Питание
        </a>
        <a href="#" class="nav-item" data-page="integrations" onclick="App.navigate('integrations'); return false;">
          <span class="nav-icon">🔗</span> Интеграции
        </a>
        <a href="#" class="nav-item" data-page="equipment" onclick="App.navigate('equipment'); return false;">
          <span class="nav-icon">👟</span> Экипировка
        </a>
        <a href="#" class="nav-item" data-page="community" onclick="App.navigate('community'); return false;">
          <span class="nav-icon">👥</span> Сообщество
        </a>
        <a href="#" class="nav-item" data-page="about" onclick="App.navigate('about'); return false;">
          <span class="nav-icon">ℹ️</span> О проекте
        </a>
        <a href="#" class="nav-item" data-page="settings" onclick="App.navigate('settings'); return false;">
          <span class="nav-icon">⚙️</span> Настройки
        </a>
        <a href="#" class="nav-item" id="nav-admin" data-page="admin" onclick="App.navigate('admin'); return false;">
          <span class="nav-icon">🛡️</span> Админ-панель
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-full" onclick="App.installPWA()" style="margin-bottom:0.75rem; background:#f0fdf4; border-color:#bbf7d0; color:#15803d;">
          📲 Установить на телефон
        </button>
        <div class="user-info">
          <div class="user-avatar" id="sidebar-avatar">👤</div>
          <div class="user-details">
            <span class="user-name" id="sidebar-username">Rizat Sakupov</span>
            <span class="user-role" id="sidebar-role">Администратор</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm btn-full" onclick="App.logout()">Обновить сессию</button>
      </div>
    </aside>

    <!-- Main Content Dynamic Container -->
    <main id="content" class="content"></main>

  </div>

  <!-- Application Logic Modules -->
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/training.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
